[platformio]
default_envs = xiao_vision

[env]
platform = platformio/espressif32@7.0.1
board = seeed_xiao_esp32s3
framework = arduino
; Arduino-ESP32 2.0.17; use the installed, fixed package revision.
platform_packages =
    platformio/framework-arduinoespressif32@3.20017.241212+sha.dcc1105b
upload_protocol = esptool
upload_speed = 460800
monitor_speed = 115200
monitor_dtr = 1
monitor_rts = 0
monitor_filters = direct
; The board manifest enables native USB CDC, USB mode 1 and OPI PSRAM.
; COM ports are selected at runtime, never committed here.
; src/servo_test/ is a separate bench firmware (env:xiao_servo_test only).
build_src_filter = +<*> -<servo_test/>

[env:xiao_bringup]

[env:xiao_vision]
build_flags =
    -DBLL_VISION_BRINGUP=1
    -DBLL_PASSIVE_ADC_FRONTEND_VERIFIED=1
; Fixed upstream sources and licenses are in lib/, see UPSTREAM.txt.

[env:xiao_evidence]
extends = env:xiao_vision
build_flags =
    ${env:xiao_vision.build_flags}
    -DBLL_EVIDENCE_STORE=1


; Standalone servo bench test on D2 (no Evidence store / LittleFS / Vision / ADC).
[env:xiao_servo_test]
build_src_filter = -<*> +<servo_test/>

; ---- Arduino Nano ESP32 (ABX00083, u-blox NORA-W106 / ESP32-S3, 16 MB flash) - 2026-11-23 ----
; Same sources; BLL_BOARD_NANO_ESP32 selects the pins and the log partition in config.h.
; BOARD_USES_HW_GPIO_NUMBERS: D2/A4/A5 are GPIO numbers (5/11/12) everywhere, including the
; ESP-IDF calls (LEDC, ADC DMA, Wire.begin), instead of the core's Arduino pin remap.
; Upload: USB DFU (the board's default; dfu-util is fetched by PlatformIO). The stock
; partition table (app3M_fat9M_fact512k_16MB) is kept, so DFU and the Arduino recovery
; partition keep working; the Evidence log uses its data partition "ffat" (see config.h).
[nano_esp32]
board = arduino_nano_esp32
upload_protocol = dfu
nano_flags =
    -DBLL_BOARD_NANO_ESP32=1
    -DBOARD_USES_HW_GPIO_NUMBERS=1

; Serial echo / LED only (first step on new hardware).
[env:nano_bringup]
board = ${nano_esp32.board}
upload_protocol = ${nano_esp32.upload_protocol}
build_flags = ${nano_esp32.nano_flags}

; Same profile as xiao_evidence (Vision V2 I2C, servo arm, Evidence log, ADC streaming).
[env:nano_evidence]
board = ${nano_esp32.board}
upload_protocol = ${nano_esp32.upload_protocol}
build_flags =
    ${nano_esp32.nano_flags}
    -DBLL_VISION_BRINGUP=1
    -DBLL_PASSIVE_ADC_FRONTEND_VERIFIED=1
    -DBLL_EVIDENCE_STORE=1

; Servo bench test on the Nano's D2 (GPIO5).
[env:nano_servo_test]
board = ${nano_esp32.board}
upload_protocol = ${nano_esp32.upload_protocol}
build_flags = ${nano_esp32.nano_flags}
build_src_filter = -<*> +<servo_test/>
